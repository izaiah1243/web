<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love you so much my love so so so so so so so much</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--accent:#ff69b4;--btn:#ff1493}
body{background:#000}
.image-section{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;width:100%;max-width:1100px}
.image-section img{width:min(300px,100%);border-radius:15px;box-shadow:0 4px 8px rgba(255,255,255,.2);cursor:zoom-in;transition:transform .25s}
.image-section img:hover{transform:scale(1.03)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out;padding:1rem}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 0 30px var(--accent)}
</style>
</head>
<body>
    <h1>I Love you so much my love so so so so so so so much</h1>
    <p>i will keep adding photos to this</p>
    <div class="image-section">

        <img src="photos/IMG_1553.jpeg" alt="Memory 15">
        <img src="photos/IMG_1575.jpeg" alt="Memory 16">
        <img src="photos/IMG_1589.jpeg" alt="Memory 17">
        <img src="photos/IMG_1596.jpeg" alt="Memory 18">
        <img src="photos/IMG_1719.jpeg" alt="Memory 19">
    </div>
    <a href="index.html" class="heart-button" style="margin-top:2rem">Return to Home</a>

    <div id="lightbox" aria-hidden="true"><img alt=""></div>
    <script>
      const box = document.getElementById('lightbox'), big = box.querySelector('img');
      document.querySelectorAll('.image-section img').forEach(img => {
        img.addEventListener('click', () => { big.src = img.src; big.alt = img.alt; box.classList.add('open'); });
      });
      box.addEventListener('click', () => box.classList.remove('open'));
      document.addEventListener('keydown', e => { if (e.key === 'Escape') box.classList.remove('open'); });
    </script>
</body>
</html>
