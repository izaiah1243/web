<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Tara</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--accent:#ff69b4;--btn:#ff1493}
body{background:#121212}
.menu{position:fixed;top:16px;left:16px;z-index:5;text-align:left}
.hamburger{cursor:pointer;width:38px;height:34px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(0,0,0,.5);border:none;border-radius:6px}
.line{height:4px;width:100%;background:#ff69b4;border-radius:2px;transition:transform .3s,opacity .3s}
.hamburger[aria-expanded="true"] .line:nth-child(1){transform:translateY(11px) rotate(45deg)}
.hamburger[aria-expanded="true"] .line:nth-child(2){opacity:0}
.hamburger[aria-expanded="true"] .line:nth-child(3){transform:translateY(-11px) rotate(-45deg)}
.menu-content{display:none;position:absolute;top:44px;left:0;min-width:190px;background:rgba(255,20,147,.95);border-radius:8px;box-shadow:0 0 12px rgba(0,0,0,.6);overflow:hidden}
.menu-content.open{display:block}
.menu-content a{color:#fff;text-decoration:none;padding:10px 16px;display:block}
.menu-content a:hover,.menu-content a:focus-visible{background:#ff69b4}
.tabs{margin-top:1.5rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem}
.tab{padding:.9rem 1.6rem;background:#ff1493;color:#fff;font-weight:bold;border-radius:10px;text-decoration:none;transition:background .3s,transform .2s}
.tab:hover{background:#ff69b4;transform:translateY(-2px)}
.image-container{width:min(300px,75vw);height:min(300px,75vw);box-shadow:0 0 40px 20px rgba(255,20,147,.5);transition:transform .3s}
.image-container:hover{transform:scale(1.05)}
.heart{color:#ff69b4;display:inline-block;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.code-hint{margin-top:2.5rem}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
  <nav class="menu">
    <button class="hamburger" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu-content">
      <span class="line"></span><span class="line"></span><span class="line"></span>
    </button>
    <div class="menu-content" id="menu-content">

    </div>
  </nav>

  <h1>I LOVE YOU MOST <span class="heart">❤️</span></h1>
  <div class="image-container">
    <img src="photos/IMG_1113.jpeg" alt="A beautiful image" />
  </div>

  <div class="tabs">
    <a class="tab" href="best.html">Reasons Why Tara is the Best</a>
    <a class="tab" href="perfect.html">Reasons Why Tara is Perfect</a>

  <h1 class="code-hint">WHATS THE CODE?</h1>
  <div id="codes">
    <a href="memories.html?code=5225" class="button">Option 1: 5225</a>
    <button class="button wrong">Option 2: 8976</button>
    <button class="button wrong">Option 3: 1234</button>
  </div>
  <p class="msg" id="code-msg" aria-live="polite"></p>

  <script>
    const btn = document.getElementById('menu-btn'), menu = document.getElementById('menu-content');
    function setMenu(open) { menu.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); }
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
    document.addEventListener('click', () => setMenu(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

    const codeMsg = document.getElementById('code-msg');
    document.querySelectorAll('.wrong').forEach(b => b.addEventListener('click', () => {
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      codeMsg.textContent = 'NOPE';
    }));
  </script>
</body>
