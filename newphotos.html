<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Photos ❤️</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--accent:#ff69b4;--btn:#ff1493}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:#fff; background:
  radial-gradient(circle at 15% 10%,rgba(255,105,180,.16),transparent 28%),
  radial-gradient(circle at 85% 20%,rgba(255,20,147,.12),transparent 30%),#090909;
  font-family:inherit; padding:72px 20px 50px;
}
.menu{position:fixed;top:16px;left:16px;z-index:20;text-align:left}
.hamburger{cursor:pointer;width:38px;height:34px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(0,0,0,.65);border:1px solid rgba(255,105,180,.35);border-radius:8px}
.line{height:4px;width:100%;background:#ff69b4;border-radius:2px;transition:transform .3s,opacity .3s}
.hamburger[aria-expanded="true"] .line:nth-child(1){transform:translateY(11px) rotate(45deg)}
.hamburger[aria-expanded="true"] .line:nth-child(2){opacity:0}
.hamburger[aria-expanded="true"] .line:nth-child(3){transform:translateY(-11px) rotate(-45deg)}
.menu-content{display:none;position:absolute;top:44px;left:0;min-width:190px;background:rgba(255,20,147,.96);border-radius:8px;box-shadow:0 0 18px rgba(255,20,147,.25);overflow:hidden}
.menu-content.open{display:block}
.menu-content a{color:#fff;text-decoration:none;padding:10px 16px;display:block}
.menu-content a:hover,.menu-content a:focus-visible{background:#ff69b4}

.hero{max-width:1050px;margin:0 auto 34px;text-align:center}
.eyebrow{color:#ff9dcc;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;font-weight:700}
h1{font-size:clamp(2.2rem,6vw,4.5rem);margin:.35rem 0 .7rem;line-height:1}
.subtitle{max-width:650px;margin:auto;color:#d7d7d7;line-height:1.6}
.heart{display:inline-block;color:#ff69b4;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.toolbar{max-width:1050px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{color:#aaa;font-size:.9rem}
.home{color:#fff;text-decoration:none;background:#ff1493;padding:.65rem 1rem;border-radius:10px;font-weight:700;transition:.2s}
.home:hover{background:#ff69b4;transform:translateY(-2px)}

.gallery{max-width:1100px;margin:auto;columns:4 220px;column-gap:16px}
.card{break-inside:avoid;margin:0 0 16px;position:relative;border-radius:16px;overflow:hidden;background:#151515;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 25px rgba(0,0,0,.35);cursor:zoom-in}
.card img{display:block;width:100%;height:auto;transition:transform .45s ease,filter .45s ease}
.card:hover img{transform:scale(1.035);filter:brightness(1.08)}
.card::after{content:'♡';position:absolute;right:12px;bottom:10px;color:#fff;font-size:1.35rem;text-shadow:0 2px 8px #000;opacity:0;transition:.25s}
.card:hover::after{opacity:1}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:min(1100px,94vw);max-height:88vh;object-fit:contain;border-radius:14px;box-shadow:0 0 45px rgba(255,20,147,.38)}
.close{position:fixed;top:18px;right:22px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,20,147,.85);color:#fff;font-size:1.5rem;cursor:pointer}
.tip{text-align:center;color:#888;font-size:.8rem;margin-top:25px}
@media(max-width:650px){body{padding-left:12px;padding-right:12px}.gallery{columns:2 150px;column-gap:10px}.card{margin-bottom:10px}}
</style>
</head>
<body>
<nav class="menu">
  <button class="hamburger" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu-content">
    <span class="line"></span><span class="line"></span><span class="line"></span>
  </button>
  <div class="menu-content" id="menu-content">
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="pictures.html">Pictures</a>
    <a href="newphotos.html">New photos</a>
    <a href="game.html">Flower mission</a>
    <a href="game2.html">Take over the world!</a>
    <a href="mydrugs.html">MYDRUGS</a>
    <a href="sydney.html">sydney</a>
    <a href="anniversary.html">ANNIVERSARY</a>
  </div>
</nav>

<header class="hero">
  <h1>New Photos <span class="heart">♡</span></h1>
  <p class="subtitle">Some new photos of us i have</p>
</header>

<div class="toolbar">
  <a class="home" href="index.html">Back home ❤️</a>
</div>

<main class="gallery" aria-label="Photo gallery">
  <figure class="card"><img src="photos/new-photo-1.jpg" alt="Memory 1" loading="eager"></figure>
  <figure class="card"><img src="photos/new-photo-2.jpg" alt="Memory 2" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-3.png" alt="Memory 3" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-4.png" alt="Memory 4" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-5.jpg" alt="Memory 5" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-6.jpg" alt="Memory 6" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-7.jpg" alt="Memory 7" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-8.jpg" alt="Memory 8" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-9.png" alt="Memory 9" loading="lazy"></figure>
  <figure class="card"><img src="photos/new-photo-10.jpg" alt="Memory 10" loading="lazy"></figure>
</main>

<p class="tip">I LOVE YOUUUUUU</p>

<div id="lightbox" aria-hidden="true">
  <button class="close" id="close" aria-label="Close photo">×</button>
  <img alt="">
</div>

<script>
const btn=document.getElementById('menu-btn'),menu=document.getElementById('menu-content');
function setMenu(open){menu.classList.toggle('open',open);btn.setAttribute('aria-expanded',open)}
btn.addEventListener('click',e=>{e.stopPropagation();setMenu(!menu.classList.contains('open'))});
document.addEventListener('click',()=>setMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setMenu(false);document.getElementById('lightbox').classList.remove('open')}});

const box=document.getElementById('lightbox'),big=box.querySelector('img'),close=document.getElementById('close');
document.querySelectorAll('.card img').forEach(img=>img.addEventListener('click',e=>{
  e.stopPropagation();big.src=img.src;big.alt=img.alt;box.classList.add('open');box.setAttribute('aria-hidden','false');
}));
function closeBox(){box.classList.remove('open');box.setAttribute('aria-hidden','true')}
box.addEventListener('click',e=>{if(e.target===box)closeBox()});
close.addEventListener('click',closeBox);
</script>
</body>
</html>
